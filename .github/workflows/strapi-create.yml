name: Create Strapi App and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-strapi:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_LOGLEVEL: "error"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean previous files
        run: |
          rm -rf app strapi-app.zip

      - name: Create Strapi app
        run: |
          npx --yes create-strapi@latest app --quickstart --no-run --skip-cloud --use-npm

      - name: Remove generated git directory
        run: |
          rm -rf app/.git

      - name: Pack Strapi app
        run: |
          zip -r strapi-app.zip app

      - name: Generate release tag
        id: release_tag
        run: |
          TAG="strapi-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Strapi App ${{ steps.release_tag.outputs.tag }}
          body: |
            Auto-generated Strapi app.

            Command:
            npx create-strapi@latest app --quickstart --no-run --skip-cloud --use-npm

            Node.js:
            22
          files: strapi-app.zip
